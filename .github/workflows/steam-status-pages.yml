name: Publish Profile Site
run-name: Publish profile site — ${{ github.event_name }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/steam-status-pages.yml
      - projects/steam-status-tracker/public/**
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: profile-site-pages
  cancel-in-progress: false

jobs:
  prepare-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Steam data
        id: steam
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID64: ${{ vars.STEAM_ID64 }}
          STEAM_VANITY: ${{ vars.STEAM_VANITY }}
        run: node projects/steam-status-tracker/scripts/update-steam-status.mjs

      - name: Save meaningful Steam changes
        if: steps.steam.outputs.persist == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/steam-status-tracker/public/data/status.json
          git add projects/steam-status-tracker/public/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Steam activity [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Validate project
        continue-on-error: true
        working-directory: projects/steam-status-tracker
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/steam-status-tracker/public

  deploy-site:
    needs: prepare-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
