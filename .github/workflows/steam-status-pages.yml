name: Steam Status Tracker

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/steam-status-pages.yml
      - projects/steam-status-tracker/public/**
      - projects/steam-status-tracker/scripts/**
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: status-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read Steam status
        id: steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_VANITY: quixylon
        run: node projects/steam-status-tracker/scripts/update-steam-status.mjs

      - name: Send GitHub Mobile notification
        if: steps.steam.outputs.notify == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const data = JSON.parse(readFileSync('projects/steam-status-tracker/public/data/status.json', 'utf8'));
          const player = data.player;
          const statusNames = {
            offline: 'не в сети',
            online: 'в сети',
            busy: 'занят',
            away: 'отошёл',
            snooze: 'спит',
            'looking-to-trade': 'ищет обмен',
            'looking-to-play': 'ищет игру',
            'in-game': 'в игре',
            unknown: 'неизвестный статус'
          };

          let headline;
          if (player.gameName) {
            headline = `🎮 ${player.name} запустил игру: **${player.gameName}**`;
          } else if (player.status === 'offline') {
            headline = `⚫ ${player.name} вышел из сети`;
          } else {
            headline = `🟢 ${player.name}: **${statusNames[player.status] || statusNames.unknown}**`;
          }

          const checkedAt = new Intl.DateTimeFormat('ru-RU', {
            dateStyle: 'medium',
            timeStyle: 'short',
            timeZone: 'Europe/Moscow'
          }).format(new Date(data.checkedAt));

          const body = [
            '@Quixylon',
            '',
            `## ${headline}`,
            '',
            `Проверено: ${checkedAt} МСК`,
            '',
            `[Открыть Steam-профиль](${player.profileUrl}) · [Открыть трекер](https://quixylon.github.io/AI/tracker/)`
          ].join('\n');

          writeFileSync('/tmp/steam-notification.md', body);
          NODE
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/steam-notification.md

      - name: Save meaningful status changes
        if: steps.steam.outputs.persist == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/steam-status-tracker/public/data/status.json
          git add projects/steam-status-tracker/public/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Steam activity [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build polished profile preview
        run: node projects/steam-status-tracker/scripts/build-profile-v2.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/steam-status-tracker/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
