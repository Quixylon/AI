name: Steam Status Tracker

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/steam-status-pages.yml
      - projects/steam-status-tracker/public/index.html
      - projects/steam-status-tracker/public/app.js
      - projects/steam-status-tracker/public/styles.css
      - projects/steam-status-tracker/public/.nojekyll
      - projects/steam-status-tracker/scripts/**
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: steam-status-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read Steam status
        id: steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_VANITY: quixylon
        run: node projects/steam-status-tracker/scripts/update-steam-status.mjs

      - name: Save meaningful status changes
        if: steps.steam.outputs.persist == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/steam-status-tracker/public/data/status.json
          git add projects/steam-status-tracker/public/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Steam activity [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/steam-status-tracker/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
