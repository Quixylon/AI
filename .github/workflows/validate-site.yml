name: Validate Profile Site

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-site.yml
      - projects/steam-status-tracker/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate project
        working-directory: projects/steam-status-tracker
        run: npm run check
