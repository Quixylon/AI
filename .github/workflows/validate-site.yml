name: Publish Profile Site
run-name: Publish profile site — ${{ github.event_name }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-site.yml
      - projects/steam-status-tracker/public/**
      - projects/steam-status-tracker/scripts/**
      - projects/steam-status-tracker/tests/**
      - projects/steam-status-tracker/package.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-site.yml
      - projects/steam-status-tracker/**
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests cannot cancel a live deployment or scheduled refresh.
  group: profile-site-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Validate project
        working-directory: projects/steam-status-tracker
        run: npm run check

  publish:
    permissions:
      contents: write
      pages: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Refresh Steam data
        id: steam
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID64: ${{ vars.STEAM_ID64 }}
          STEAM_VANITY: ${{ vars.STEAM_VANITY }}
        run: node projects/steam-status-tracker/scripts/update-steam-status.mjs

      - name: Validate refreshed project
        working-directory: projects/steam-status-tracker
        run: npm run check

      - name: Save successful Steam snapshot
        if: steps.steam.outputs.persist == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/steam-status-tracker/public/data/status.json
          git add projects/steam-status-tracker/public/data/history.json
          git add projects/steam-status-tracker/public/data/games.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Steam snapshot [skip ci]"
            git push origin HEAD:main
          fi

      - name: Write deployment marker
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          writeFileSync('projects/steam-status-tracker/public/data/build-info.json', JSON.stringify({
            sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            runId: process.env.GITHUB_RUN_ID,
            event: process.env.GITHUB_EVENT_NAME,
            builtAt: new Date().toISOString(),
            design: 'soft-blur-20260910'
          }, null, 2) + '\n');
          JS

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/steam-status-tracker/public

  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry Pages deployment again
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        id: deployment_retry_2
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail if Pages is still unavailable
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        run: |
          echo "GitHub Pages rejected all deployment attempts."
          exit 1
