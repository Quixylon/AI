<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Персональная страница Quixylon: описание, ссылки, музыка и Steam Tracker." />
    <title>Quixylon</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="interactive-background" aria-hidden="true"></canvas>
    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <main class="landing-shell">
      <section id="profile-card" class="profile-card" aria-labelledby="profile-name">
        <div class="profile-glow" aria-hidden="true"></div>

        <header class="profile-header">
          <div class="avatar-wrap">
            <img id="profile-avatar" class="profile-avatar" src="" alt="" />
            <span class="avatar-ring" aria-hidden="true"></span>
          </div>

          <div class="identity">
            <p id="profile-handle" class="handle">@quixylon</p>
            <h1 id="profile-name">Quixylon</h1>
            <p id="steam-name" class="steam-name">Загрузка профиля…</p>
          </div>
        </header>

        <p id="profile-description" class="description">
          Steam, CS2 и всё важное — в одном месте.
        </p>

        <nav id="profile-links" class="profile-links" aria-label="Ссылки Quixylon"></nav>

        <a class="tracker-button" href="./tracker/">
          <span class="tracker-icon" aria-hidden="true">⌁</span>
          <span class="tracker-copy">
            <strong>Открыть Steam Tracker</strong>
            <small>Статус, игры и история сессий</small>
          </span>
          <span class="tracker-arrow" aria-hidden="true">→</span>
        </a>

        <section id="spotify-section" class="spotify-section" hidden aria-label="Музыка Spotify">
          <div class="section-caption">
            <span>Сейчас в профиле</span>
            <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </div>
          <iframe
            id="spotify-player"
            title="Spotify player"
            src=""
            width="100%"
            height="152"
            frameborder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
          ></iframe>
        </section>

        <footer class="profile-footer">
          <span id="profile-status">GitHub Pages</span>
          <a href="https://guns.lol/quixylon" target="_blank" rel="noreferrer">guns.lol/quixylon ↗</a>
        </footer>
      </section>

      <p class="interaction-hint">Двигайте курсором · на телефоне касайтесь фона</p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
