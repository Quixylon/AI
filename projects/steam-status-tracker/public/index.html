<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="Персональная страница Qu’lon: цифровые следы, ссылки и Steam Tracker." />
    <title>Qu’lon</title>
    <link rel="stylesheet" href="./styles.css?v=8" />
  </head>
  <body>
    <canvas id="interactive-background" aria-hidden="true"></canvas>
    <div class="fallback-stars fallback-stars-one" aria-hidden="true"></div>
    <div class="fallback-stars fallback-stars-two" aria-hidden="true"></div>
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <main class="landing-shell">
      <section id="profile-card" class="profile-card" aria-labelledby="profile-name">
        <div class="profile-glow" aria-hidden="true"></div>
        <div class="card-shine" aria-hidden="true"></div>

        <header class="profile-header depth-layer depth-high">
          <div class="avatar-wrap">
            <img id="profile-avatar" class="profile-avatar" src="" alt="" />
            <span class="avatar-ring" aria-hidden="true"></span>
          </div>

          <div class="identity">
            <h1 id="profile-name">Qu’lon</h1>
            <p id="profile-handle" class="handle">@quixylon</p>
          </div>
        </header>

        <section class="about depth-layer" aria-label="Описание профиля">
          <p class="about-greeting"><span>Привет</span><span class="about-emoji" aria-hidden="true">🐈</span></p>
          <p id="profile-description" class="description">
            Здесь собраны мои некоторые цифровые следы — места, где я иногда появляюсь.
          </p>
          <span class="about-line" aria-hidden="true"></span>
        </section>

        <nav id="profile-links" class="profile-links depth-layer" aria-label="Ссылки Qu’lon"></nav>

        <a id="guns-card" class="guns-card floating-action depth-layer" href="https://guns.lol/quixylon" target="_blank" rel="noreferrer">
          <span id="guns-dot" class="presence-dot unknown" aria-hidden="true"></span>
          <strong>guns.lol</strong>
          <span class="card-arrow" aria-hidden="true">↗</span>
        </a>

        <a class="tracker-button floating-action depth-layer" href="./tracker/">
          <span class="tracker-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M3 12h4l2.2-6 4.1 12 2.3-6H21"></path>
            </svg>
          </span>
          <strong>Steam Tracker</strong>
          <span class="card-arrow" aria-hidden="true">→</span>
        </a>

        <footer class="profile-footer depth-layer">
          <span id="profile-status">Steam Tracker</span>
          <span class="footer-separator">•</span>
          <span id="view-count">Просмотры: …</span>
        </footer>
      </section>
    </main>

    <script type="module" src="./app.js?v=8"></script>
  </body>
</html>
